# The dashboard is a single-page app: any path that is not a real file is the
# app shell. The gateway proxies /api to the API, so nginx only ever serves
# static assets.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed asset filenames are immutable; the shell must never be cached or a
  # deploy would keep serving the previous build.
  location /assets/ {
    add_header cache-control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header cache-control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    add_header content-type application/json;
    return 200 '{"status":"ok","service":"kazi-agentos-dashboard"}';
  }
}
