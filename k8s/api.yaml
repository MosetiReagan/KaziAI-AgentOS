apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: kazi-agentos
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: kazi-agentos
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      # Long enough for a run to reach a checkpoint before the pod disappears.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: kazi-ai-agentos:latest
          envFrom:
            - configMapRef:
                name: kazi-agentos-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kazi-agentos-secrets
                  key: DATABASE_URL
            - name: KZ_API_BOOTSTRAP_KEY
              valueFrom:
                secretKeyRef:
                  name: kazi-agentos-secrets
                  key: KZ_API_BOOTSTRAP_KEY
                  optional: true
            - name: KZ_API_HOST
              value: 0.0.0.0
            - name: KZ_API_PORT
              value: '4000'
          ports:
            - containerPort: 4000
              name: http
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: '2', memory: 2Gi }
          volumeMounts:
            # The API owns the workspaces; the worker mounts the same volume so
            # a run created here executes against the same files (spec §70).
            - name: data
              mountPath: /var/lib/kazi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kazi-agentos-data
