# Copy to secret.yaml, replace every value, and apply it before the rest of the
# stack. `.gitignore` already excludes `*.key`/`.env*`; add `k8s/secret.yaml`.
apiVersion: v1
kind: Secret
metadata:
  name: kazi-agentos-secrets
  labels:
    app.kubernetes.io/part-of: kazi-agentos
type: Opaque
stringData:
  DATABASE_URL: postgresql://kazi:REPLACE_ME@postgres:5432/kazi?schema=public
  POSTGRES_PASSWORD: REPLACE_ME
  # Pin the bootstrap admin key instead of reading it from the API logs.
  KZ_API_BOOTSTRAP_KEY: kz_live_boot.REPLACE_ME
  # Any provider keys the runtime should discover (spec §11 / §77).
  OPENAI_API_KEY: REPLACE_ME
