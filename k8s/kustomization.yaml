apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kazi-agentos
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - postgres.yaml
  - redis.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - dashboard.yaml
  - gateway.yaml
  - ingress.yaml
# `secret.example.yaml` is deliberately not listed: copy it, fill it in, and add
# it here (or create the Secret with your own tooling). Never commit a real one.
